version: '{build}'

build: off
test: off

clone_depth: 1

branches:
  only:
    - main

image: Visual Studio 2022

cache:
  - C:\msys64\var\cache\pacman\pkg -> appveyor.yml
  - C:\msys64\mingw64 -> appveyor.yml
  - C:\ProgramData\chocolatey\cache -> appveyor.yml

environment:
  matrix:
    - MINGW_DIR: C:\msys64\mingw64

init:
  - cmd: "echo APPVEYOR_REPO_COMMIT = %APPVEYOR_REPO_COMMIT%"
  - ps: |
      $short = $env:APPVEYOR_REPO_COMMIT.Substring(0,7)
      Set-AppveyorBuildVariable -Name SHORT_COMMIT -Value $short
      Write-Host "SHORT_COMMIT set to $short"

install:
  - cmd: "echo === Starting install phase ==="
  - cmd: "choco install msys2 --confirm --yes"
  - cmd: "refreshenv"
  - cmd: "C:\\tools\\msys64\\usr\\bin\\pacman.exe -Syu --noconfirm"
  - cmd: "C:\\tools\\msys64\\usr\\bin\\pacman.exe -S --noconfirm mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2"
  - cmd: "echo === Install done ==="

build_script:
  - cmd: "echo === Build script starting ==="
  - cmd: "echo Current dir: %CD%"
  - cmd: "dir src || echo ERROR: src folder missing!"
  - cmd: "mkdir bin"
  - cmd: "C:\\tools\\msys64\\mingw64\\bin\\gcc.exe -v || echo ERROR: gcc not found!"
  - cmd: "C:\\tools\\msys64\\mingw64\\bin\\gcc.exe -DNDEBUG -O2 -g0 -s -static -lmingw32 -lSDL2main -lSDL2 -ldinput8 -ldxguid -ldsound -ldxgi -ldxerr8 -lhid -lsetupapi -ladvapi32 -lcomdlg32 -lshell32 -lshlwapi -lole32 -loleaut32 -limm32 -luser32 -lgdi32 -lwinmm -lversion -luuid -lws2_32 -lksuser src/uxn2.c -o bin/uxn2.exe"
  - cmd: "dir bin || echo ERROR: bin empty!"
  - cmd: "if exist bin\\uxn2.exe (echo SUCCESS: exe created) else (echo ERROR: exe NOT created! & exit /b 1)"

artifacts:
  - path: bin/uxn2.exe
    name: uxn2-main-$(SHORT_COMMIT).exe

on_finish:
  - cmd: "if exist bin\\uxn2.exe (echo Artifact should be there) else (echo No exe - check compile)"
