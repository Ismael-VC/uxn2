name: Build Windows EXE (static)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-SDL2

      - name: Build uxn2.exe (static linking)
        shell: msys2 {0}
        run: |
          mkdir -p bin
          gcc -DNDEBUG -O2 -g0 -s -static \
            -lmingw32 -lSDL2main -lSDL2 \
            -luser32 -lgdi32 -lwinmm -limm32 -lole32 -loleaut32 -lversion -luuid \
            src/uxn2.c -o bin/uxn2.exe

      - name: Upload artifact (standalone uxn2.exe)
        uses: actions/upload-artifact@v4
        with:
          name: uxn2-windows-${{ github.sha }}
          path: bin/uxn2.exe
          if-no-files-found: error
          retention-days: 14
